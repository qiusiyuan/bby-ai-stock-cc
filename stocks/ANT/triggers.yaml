kill_conditions:
  - "季度营收环比增量连续两个季度衰减（$54 亿之后再降两次）—— 直接否证 2027 约 $1,760 亿营收路径，22x 倍数失去依据"
  - "经营利润率从 −3.3% 继续恶化，且营收增速同时减速 —— 在用越来越贵的算力买越来越慢的增长"
  - "为兑付 $8,954 亿采购承诺发行大额稀释性股权或高息债 —— 揭示承诺与现金流缺口大于披露"
  - "七家供应商中任意一家公开减记其 $260 亿配售持仓 —— 循环融资由争议变为已实现损失"
  - "独立评测上连续两代落后 OpenAI / Google —— 足够大的能力差会撬动已装机的工作流"

re_read_triggers:
  - "Stock down >15% on no obvious news"
  - "首份公开季报发布（预计 2027-02，日期待确认）"
  - "Lockup 分层时间表首次公开披露 —— 当前为最大已知数据缺口"
  - "Nasdaq-100 或 S&P 500 纳入/落选裁决"
  - "任一供应商在财报中单列其 ANT 持仓的公允价值变动"
  - "单日成交量 > 3 亿股且价格反向 —— 解禁或大额机构调整的信号"

